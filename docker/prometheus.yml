# Prometheus Configuration for KalmanGuard

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alerting configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Rule files
rule_files: []

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Agent Service Metrics
  - job_name: 'kalmanguard-agents'
    static_configs:
      - targets: ['agents:3001']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Kalman Engine Metrics
  - job_name: 'kalmanguard-kalman-engine'
    static_configs:
      - targets: ['kalman-engine:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Redis Metrics (using redis_exporter)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
