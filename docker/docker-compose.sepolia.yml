# Sepolia judge-demo override
# Usage: docker compose -f docker/docker-compose.yml -f docker/docker-compose.sepolia.yml up -d --build

services:
  agents:
    environment:
      - DEMO_MODE=false
      - TARGET_CHAINS=sepolia
      - RPC_URL_SEPOLIA=${RPC_URL_SEPOLIA:-https://0xrpc.io/sep}
      - ENABLE_HEARTBEAT_TX=${ENABLE_HEARTBEAT_TX:-true}
      - HEARTBEAT_TX_MS=${HEARTBEAT_TX_MS:-60000}
