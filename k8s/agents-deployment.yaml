apiVersion: apps/v1
kind: Deployment
metadata:
  name: kalmanguard-agents
  labels:
    app: kalmanguard-agents
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kalmanguard-agents
  template:
    metadata:
      labels:
        app: kalmanguard-agents
    spec:
      containers:
      - name: agents
        image: kalmanguard/agents:latest
        ports:
        - containerPort: 3001
          name: http
        - containerPort: 3002
          name: websocket
        envFrom:
        - configMapRef:
            name: kalmanguard-config
        - secretRef:
            name: kalmanguard-secrets
        resources:
          requests:
            memory: "2Gi"
            cpu: "1"
          limits:
            memory: "4Gi"
            cpu: "2"
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: agents
spec:
  selector:
    app: kalmanguard-agents
  ports:
  - name: http
    port: 3001
    targetPort: 3001
  - name: websocket
    port: 3002
    targetPort: 3002
