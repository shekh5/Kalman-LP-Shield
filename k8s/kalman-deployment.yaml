apiVersion: apps/v1
kind: Deployment
metadata:
  name: kalmanguard-kalman
  labels:
    app: kalmanguard-kalman
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kalmanguard-kalman
  template:
    metadata:
      labels:
        app: kalmanguard-kalman
    spec:
      containers:
      - name: kalman-engine
        image: kalmanguard/kalman-engine:latest
        ports:
        - containerPort: 8000
          name: http
        envFrom:
        - configMapRef:
            name: kalmanguard-config
        resources:
          requests:
            memory: "2Gi"
            cpu: "1"
          limits:
            memory: "4Gi"
            cpu: "2"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: kalman-engine
spec:
  selector:
    app: kalmanguard-kalman
  ports:
  - name: http
    port: 8000
    targetPort: 8000
