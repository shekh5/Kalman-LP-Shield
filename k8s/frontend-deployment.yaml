apiVersion: apps/v1
kind: Deployment
metadata:
  name: kalmanguard-frontend
  labels:
    app: kalmanguard-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kalmanguard-frontend
  template:
    metadata:
      labels:
        app: kalmanguard-frontend
    spec:
      containers:
      - name: frontend
        image: kalmanguard/frontend:latest
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app: kalmanguard-frontend
  ports:
  - name: http
    port: 80
    targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kalmanguard-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
  - hosts:
    - kalmanguard.example.com
    secretName: kalmanguard-tls
  rules:
  - host: kalmanguard.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: agents
            port:
              number: 3001
      - path: /ws
        pathType: Prefix
        backend:
          service:
            name: agents
            port:
              number: 3002
